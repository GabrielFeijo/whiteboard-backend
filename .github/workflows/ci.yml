name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: wb, POSTGRES_PASSWORD: wb, POSTGRES_DB: whiteboard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wb" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://wb:wb@localhost:5432/whiteboard
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-with-at-least-32-characters-ok
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: whiteboard-assets
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:int
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        target: [api, collab]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          tags: whiteboard-${{ matrix.target }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
